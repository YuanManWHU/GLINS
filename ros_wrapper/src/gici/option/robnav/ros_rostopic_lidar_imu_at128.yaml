# RobNav Hesai AT128 + ADIS16465 LiDAR/IMU odometry configuration

stream:
  streamers:

  # IMU input
  - streamer:
      tag: str_ros_imu
      type: ros
      topic_name: /adi/adis16465/imu
      io: input
      queue_size: 100000
      format: imu

  # Hesai AT128 input
  - streamer:
      tag: str_ros_lidar
      type: ros
      topic_name: /hesai/at128/points
      io: input
      queue_size: 100000
      format: hesai_at128

  # Pose output
  - streamer:
      tag: str_solution
      type: ros
      topic_name: solution
      queue_size: 5
      io: output
      format: pose_stamped

  # Odometry output
  - streamer:
      tag: str_solution_odometry
      type: ros
      topic_name: solution_odometry
      queue_size: 10
      io: output
      format: odometry
      subframe_id: Body

  # Path output
  - streamer:
      tag: str_solution_path
      type: ros
      topic_name: solution_path
      queue_size: 100
      io: output
      format: path

  # Current scan output
  - streamer:
      tag: str_current_scan
      type: ros
      topic_name: cloud_current
      queue_size: 100000
      io: output
      format: pointcloud2

  # Map output
  - streamer:
      tag: str_map
      type: ros
      topic_name: cloud_map
      queue_size: 100000
      io: output
      format: map


estimate:
- estimator:
    tag: est_lidar_imu
    type: lidar_imu

    input_tags: [str_ros_imu, str_ros_lidar]
    str_ros_imu_roles: [major]
    str_ros_lidar_roles: [front]

    output_tags:
      [str_solution,
       str_solution_odometry,
       str_solution_path,
       str_current_scan,
       str_map]

    output_align_tag: str_ros_imu
    output_downsample_rate: 40

    compute_covariance: false

    enable_input_align: true
    input_align_latency: 1.0

    # ------------------------------------------------------------
    # LiDAR / IMU estimator
    # ------------------------------------------------------------
    lidar_imu_options:
      max_window_length: 5

      initialization_duration: 1.0

      # LiDAR timestamp minus IMU timestamp [s].
      # A2 validation showed no measurable systematic offset.
      time_offset: 0.0

      min_registration_residuals: 30

      initial_pose_std: 1.0e-4
      initial_speed_std: 0.1
      initial_bg_std: 0.01
      initial_ba_std: 0.1


    # ------------------------------------------------------------
    # IMU
    # ------------------------------------------------------------
    imu_estimator_base_options:

      imu_parameters:

        # ADIS16465 data rate
        rate: 200

        # Initial gyro bias uncertainty [rad/s]
        sigma_bg: 2.424068e-04

        # Initial accelerometer bias uncertainty [m/s^2]
        sigma_ba: 5.000000e-04

        # Gyroscope white-noise density [rad/s/sqrt(Hz)]
        sigma_g_c: 2.908882e-05

        # Accelerometer white-noise density [m/s^2/sqrt(Hz)]
        sigma_a_c: 1.666667e-03

        # Gyro bias driving noise [rad/s^2/sqrt(Hz)]
        sigma_gw_c: 5.713584e-06

        # Accelerometer bias driving noise [m/s^3/sqrt(Hz)]
        sigma_aw_c: 1.178511e-05

      # IMU native frame:
      #   x Forward
      #   y Right
      #   z Down
      #
      # GLINS body frame:
      #   x Right
      #   y Forward
      #   z Up
      #
      # FRD -> RFU
      body_to_imu_rotation: [180.0, 0.0, 90.0]

      # Keep official LIO baseline settings for the first run.
      use_zupt: false
      car_motion: false



    # ------------------------------------------------------------
    # General estimator
    # ------------------------------------------------------------
    estimator_base_options:

      # LIO itself has no GNSS global origin.
      # Use an approximate Wuhan University position for ENU/global
      # coordinate initialization.
      force_initial_global_position: true

      initial_global_position:
        [30.5297649350, 114.3503808494, 100.1529]

      max_iteration: 15
      num_threads: 6
      max_solver_time: 0.05

      verbose_output: false

      solver_type: sparse_normal_cholesky
      trust_region_strategy_type: dogleg


    # ------------------------------------------------------------
    # LiDAR
    # ------------------------------------------------------------
    lidar_estimator_base_options:

      blind: 2.0

      var: 1.0e-2
      robust_loss_scale: 0.5
      landmark_var: 1.0e-1

      kfselect_max_rotation: 2.0
      kfselect_max_translation: 1.0
      kfselect_min_dt: 0.5

      # IMPORTANT:
      #
      # Although the YAML field is named T_B_L, GLINS subsequently
      # applies body_to_imu_rotation to this transformation.
      #
      # Therefore this field contains the calibrated T_I_L:
      #
      #   p_I = T_I_L * p_L
      #
      # LiDAR frame: FLU
      # IMU frame:   FRD
      #
      T_B_L:
        cols: 4
        rows: 4
        data: [
           0.99993733, -0.00698769, -0.00874728,  0.07000000,
          -0.00699973, -0.99997459, -0.00134683, -0.02000000,
          -0.00873764,  0.00140797, -0.99996083, -0.02000000,
           0.0,         0.0,         0.0,         1.0
        ]


    # ------------------------------------------------------------
    # LiDAR map / plane extraction
    # Keep official GLINS LIO baseline parameters initially.
    # ------------------------------------------------------------
    tree_handler_options:

      filter_radius: 0.6

      std_range: 0.05
      std_angle: 0.2

      max_near_dis: 1.0
      max_plane_dis: 0.1

      merge_size: 25

      voxel_size: 3.0
      max_layer: 2
      max_points_num: 50

      plane_threshold: 1.0e-1


logging:
  enable: true
  min_log_level: 0
  log_to_stderr: true
  file_directory: log